services:
  - type: web
    name: service-assurance-api
    runtime: node
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @workspace/api-server run build
    startCommand: pnpm --filter @workspace/db run migrate && node --enable-source-maps artifacts/api-server/dist/index.mjs
    healthCheckPath: /api/readyz
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: 'true'
      - key: DATABASE_URL
        fromDatabase:
          name: service-assurance-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: MONITORING_SCHEDULER_ENABLED
        value: 'false'
      - key: EVENT_PURGE_ENABLED
        value: 'false'

databases:
  - name: service-assurance-db
    databaseName: service_assurance
    user: service_assurance
