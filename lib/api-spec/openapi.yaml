openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Service Assurance AI API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: customers
    description: Customer management
  - name: sites
    description: Site management
  - name: services
    description: Service/circuit management
  - name: tickets
    description: Ticket management
  - name: ticket-updates
    description: Ticket update management
  - name: sla-policies
    description: SLA policy management
  - name: users
    description: User management
  - name: ai
    description: AI-powered operations
  - name: dashboard
    description: Dashboard aggregates
  - name: invoice-complaints
    description: Invoice complaint workflow
  - name: integrations
    description: Third-party integration settings
  - name: public-network-map
    description: Anonymous public network status
  - name: monitoring
    description: Monitoring targets, checks, and enrichment
  - name: controllers
    description: Network controller integrations
  - name: devices
    description: Controller-managed network devices
  - name: network-links
    description: WAN and transport links
  - name: device-events
    description: Controller and device events
  - name: salesforce
    description: Salesforce CRM synchronization

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        '200':
          description: Healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout current user
      responses:
        '200':
          description: Logged out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get current authenticated user
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get dashboard summary stats
      responses:
        '200':
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardSummary'

  /dashboard/recent-tickets:
    get:
      operationId: getRecentTickets
      tags: [dashboard]
      summary: Get recent open tickets
      parameters:
        - name: limit
          in: query
          schema:
            type: number
      responses:
        '200':
          description: Recent tickets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TicketWithRelations'

  /dashboard/escalation-needed:
    get:
      operationId: getEscalationNeeded
      tags: [dashboard]
      summary: Get tickets needing escalation
      responses:
        '200':
          description: Tickets needing escalation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TicketWithRelations'

  /customers:
    get:
      operationId: getCustomers
      tags: [customers]
      summary: List customers
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
        - name: externalSource
          in: query
          schema:
            type: string
        - name: externalId
          in: query
          schema:
            type: string
        - name: compact
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: List of customers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Customer'
    post:
      operationId: createCustomer
      tags: [customers]
      summary: Create a customer
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCustomerRequest'
      responses:
        '201':
          description: Created customer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'

  /customers/{id}:
    get:
      operationId: getCustomer
      tags: [customers]
      summary: Get customer by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Customer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerWithRelations'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      operationId: updateCustomer
      tags: [customers]
      summary: Update a customer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCustomerRequest'
      responses:
        '200':
          description: Updated customer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
    delete:
      operationId: deleteCustomer
      tags: [customers]
      summary: Delete a customer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /customers/{id}/contacts:
    get:
      operationId: getCustomerContacts
      tags: [customers]
      summary: List escalation contacts for a customer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Customer escalation contacts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CustomerContact'
    post:
      operationId: createCustomerContact
      tags: [customers]
      summary: Create escalation contact for customer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCustomerContactRequest'
      responses:
        '201':
          description: Created customer contact
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerContact'

  /customers/{id}/contacts/{contactId}:
    put:
      operationId: updateCustomerContact
      tags: [customers]
      summary: Update escalation contact for customer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: contactId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCustomerContactRequest'
      responses:
        '200':
          description: Updated customer contact
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerContact'
    delete:
      operationId: deleteCustomerContact
      tags: [customers]
      summary: Delete escalation contact for customer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: contactId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /sites:
    get:
      operationId: getSites
      tags: [sites]
      summary: List sites
      parameters:
        - name: customerId
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
        - name: externalSource
          in: query
          schema:
            type: string
        - name: externalId
          in: query
          schema:
            type: string
        - name: compact
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: List of sites
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SiteWithCustomer'
    post:
      operationId: createSite
      tags: [sites]
      summary: Create a site
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSiteRequest'
      responses:
        '201':
          description: Created site
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Site'

  /sites/{id}:
    get:
      operationId: getSite
      tags: [sites]
      summary: Get site by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Site
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteWithRelations'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      operationId: updateSite
      tags: [sites]
      summary: Update a site
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSiteRequest'
      responses:
        '200':
          description: Updated site
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Site'
    delete:
      operationId: deleteSite
      tags: [sites]
      summary: Delete a site
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /services:
    get:
      operationId: getServices
      tags: [services]
      summary: List services
      parameters:
        - name: customerId
          in: query
          schema:
            type: string
        - name: siteId
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
        - name: vendorName
          in: query
          schema:
            type: string
        - name: externalSource
          in: query
          schema:
            type: string
        - name: externalId
          in: query
          schema:
            type: string
        - name: compact
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: List of services
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ServiceWithRelations'
    post:
      operationId: createService
      tags: [services]
      summary: Create a service
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateServiceRequest'
      responses:
        '201':
          description: Created service
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Service'

  /services/{id}:
    get:
      operationId: getService
      tags: [services]
      summary: Get service by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Service
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceWithRelations'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      operationId: updateService
      tags: [services]
      summary: Update a service
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateServiceRequest'
      responses:
        '200':
          description: Updated service
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Service'
    delete:
      operationId: deleteService
      tags: [services]
      summary: Delete a service
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /tickets:
    get:
      operationId: getTickets
      tags: [tickets]
      summary: List tickets
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
        - name: severity
          in: query
          schema:
            type: string
        - name: customerId
          in: query
          schema:
            type: string
        - name: siteId
          in: query
          schema:
            type: string
        - name: vendorName
          in: query
          schema:
            type: string
        - name: sortBy
          in: query
          schema:
            type: string
        - name: sortOrder
          in: query
          schema:
            type: string
        - name: externalSource
          in: query
          schema:
            type: string
        - name: externalId
          in: query
          schema:
            type: string
        - name: compact
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: List of tickets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TicketWithRelations'
    post:
      operationId: createTicket
      tags: [tickets]
      summary: Create a ticket
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTicketRequest'
      responses:
        '201':
          description: Created ticket
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'

  /tickets/{id}:
    get:
      operationId: getTicket
      tags: [tickets]
      summary: Get ticket by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Ticket with full details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketDetail'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      operationId: updateTicket
      tags: [tickets]
      summary: Update a ticket
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTicketRequest'
      responses:
        '200':
          description: Updated ticket
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'

  /tickets/{id}/updates:
    get:
      operationId: getTicketUpdates
      tags: [ticket-updates]
      summary: Get updates for a ticket
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Ticket updates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TicketUpdate'
    post:
      operationId: createTicketUpdate
      tags: [ticket-updates]
      summary: Add an update to a ticket
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTicketUpdateRequest'
      responses:
        '201':
          description: Created ticket update
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketUpdate'

  /tickets/{id}/notifications:
    get:
      operationId: getTicketNotifications
      tags: [tickets]
      summary: Get escalation notifications for a ticket
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Escalation notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EscalationNotification'

  /tickets/{id}/evaluate-escalation:
    post:
      operationId: evaluateEscalation
      tags: [tickets]
      summary: Evaluate escalation rules and notify contacts when required
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Escalation evaluation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EscalationEvaluationResult'

  /escalation-matrix:
    get:
      operationId: getEscalationMatrix
      tags: [dashboard]
      summary: Get escalation severity matrix
      parameters:
        - name: scopeType
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/MatrixScopeType'
        - name: scopeId
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Escalation matrix for scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EscalationMatrixResponse'
    put:
      operationId: upsertEscalationMatrix
      tags: [dashboard]
      summary: Upsert escalation matrix overrides
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertEscalationMatrixRequest'
      responses:
        '200':
          description: Updated escalation matrix
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EscalationMatrixResponse'

  /escalation-matrix/override/{id}:
    delete:
      operationId: deleteEscalationMatrixOverride
      tags: [dashboard]
      summary: Delete one escalation matrix override cell
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /tickets/{id}/ai/summarize:
    post:
      operationId: aiSummarizeTicket
      tags: [ai]
      summary: Generate AI summary for a ticket
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: AI summary result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiSummarizeResponse'

  /tickets/{id}/ai/normalize-latest-update:
    post:
      operationId: aiNormalizeLatestUpdate
      tags: [ai]
      summary: Normalize the latest vendor update status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: AI normalized status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiNormalizeResponse'

  /tickets/{id}/ai/generate-customer-update:
    post:
      operationId: aiGenerateCustomerUpdate
      tags: [ai]
      summary: Generate a customer-facing update
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: AI customer update
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiCustomerUpdateResponse'

  /integrations/invoxai/customers/upsert:
    post:
      operationId: upsertInvoxaiCustomer
      tags: [customers]
      summary: Upsert customer by InvoxAI external identity
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCustomerRequest'
      responses:
        '200':
          description: Updated customer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '201':
          description: Created customer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'

  /integrations/invoxai/sites/upsert:
    post:
      operationId: upsertInvoxaiSite
      tags: [sites]
      summary: Upsert site by InvoxAI external identity
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSiteRequest'
      responses:
        '200':
          description: Updated site
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Site'
        '201':
          description: Created site
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Site'

  /integrations/invoxai/services/upsert:
    post:
      operationId: upsertInvoxaiService
      tags: [services]
      summary: Upsert service by InvoxAI external identity
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateServiceRequest'
      responses:
        '200':
          description: Updated service
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Service'
        '201':
          description: Created service
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Service'

  /integrations/invoxai/tickets/upsert:
    post:
      operationId: upsertInvoxaiTicket
      tags: [tickets]
      summary: Upsert ticket by InvoxAI external identity
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTicketRequest'
      responses:
        '200':
          description: Updated ticket
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '201':
          description: Created ticket
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'

  /public/network-map:
    get:
      operationId: getPublicNetworkMap
      tags: [public-network-map]
      summary: List public-safe monitored assets
      security: []
      responses:
        '200':
          description: Public network map points
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PublicNetworkMapPoint'

  /public/network-map/summary:
    get:
      operationId: getPublicNetworkMapSummary
      tags: [public-network-map]
      summary: Get public network status totals
      security: []
      responses:
        '200':
          description: Public network map summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicNetworkMapSummary'

  /monitoring/targets:
    get:
      operationId: getMonitoringTargets
      tags: [monitoring]
      summary: List monitoring targets
      security: [{ bearerAuth: [] }]
      parameters:
