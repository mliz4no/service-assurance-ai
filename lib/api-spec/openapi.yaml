        category: { type: string, nullable: true }
        rawPayloadJson: { type: object, additionalProperties: true, nullable: true }
        occurredAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
      required:
        [
          id,
          controllerId,
          rawEventId,
          eventSource,
          severity,
          eventType,
          title,
          occurredAt,
          createdAt,
        ]

    DeviceEventSummary:
      allOf:
        - $ref: '#/components/schemas/DeviceEvent'
        - type: object
          properties:
            controller: { $ref: '#/components/schemas/Controller', nullable: true }
            customer: { $ref: '#/components/schemas/Customer', nullable: true }

    DeviceEventDetail:
      allOf:
        - $ref: '#/components/schemas/DeviceEventSummary'
        - type: object
          properties:
            device: { $ref: '#/components/schemas/ManagedDevice', nullable: true }
            site: { $ref: '#/components/schemas/Site', nullable: true }
            linkedTickets:
              type: array
              items: { $ref: '#/components/schemas/Ticket' }
            correlations:
              type: array
              items:
                type: object
                additionalProperties: true

    SalesforceConfig:
      type: object
      properties:
        clientId: { type: string }
        clientSecret: { type: string }
        loginUrl: { type: string }
        instanceUrl: { type: string }
        username: { type: string }
        password: { type: string }
        hasClientSecret: { type: boolean }
        hasPassword: { type: boolean }
      required:
        [
          clientId,
          clientSecret,
          loginUrl,
          instanceUrl,
          username,
          password,
          hasClientSecret,
          hasPassword,
        ]

    UpdateSalesforceConfigRequest:
      type: object
      properties:
        clientId: { type: string }
        clientSecret: { type: string }
        loginUrl: { type: string }
        instanceUrl: { type: string }
        username: { type: string }
        password: { type: string }

    SalesforceSyncResponse:
      type: object
      properties:
        success: { type: boolean }
        synced: { type: integer }
        created: { type: integer }
        updated: { type: integer }
        skipped: { type: integer }
        message: { type: string }
        accounts: { type: object, additionalProperties: true }
        contacts: { type: object, additionalProperties: true }
      required: [success]

    CrmSyncLog:
      type: object
      properties:
        id: { type: string, format: uuid }
        connector: { type: string }
        syncType: { type: string }
        startedAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time, nullable: true }
        status: { type: string, enum: [running, success, failed] }
        message: { type: string, nullable: true }
        recordsProcessed: { type: integer, nullable: true }
      required: [id, connector, syncType, startedAt, status]

    SalesforceStatus:
      type: object
      properties:
        configured: { type: boolean }
        accountsSynced: { type: integer }
        contactsSynced: { type: integer }
        lastSyncAt: { type: string, format: date-time, nullable: true }
        recentLogs:
          type: array
          items: { $ref: '#/components/schemas/CrmSyncLog' }
      required: [configured, accountsSynced, contactsSynced, recentLogs]
